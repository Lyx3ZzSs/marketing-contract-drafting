name: marketing-contract-scaffold

x-backend: &backend
  build:
    context: ../backend
  image: marketing-contract-scaffold-backend:dev
  env_file:
    - path: ../.env
      required: false
  environment:
    DATABASE_URL: postgresql+psycopg://contract:contract_dev@postgres:5432/contract_drafting
    REDIS_URL: redis://redis:6379/0
    PREVIEW_DIRECTORY: /var/lib/contract-previews
    ONLYOFFICE_URL: http://onlyoffice:80
    ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?Set ONLYOFFICE_JWT_SECRET in .env}
  volumes: ["preview_data:/var/lib/contract-previews"]

services:
  onlyoffice:
    image: onlyoffice/documentserver:10.0
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?Set ONLYOFFICE_JWT_SECRET in .env}
    ports: ["127.0.0.1:18082:80"]
    volumes:
      - ${ONLYOFFICE_FONTS_DIRECTORY:-../.local/onlyoffice/fonts}:/usr/share/fonts/truetype/custom:ro
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_cache:/var/lib/onlyoffice
      - onlyoffice_logs:/var/log/onlyoffice
      - onlyoffice_db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/healthcheck | grep -qx true"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 30
    restart: unless-stopped
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: contract_drafting
      POSTGRES_USER: contract
      POSTGRES_PASSWORD: contract_dev
    ports: ["127.0.0.1:15432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contract -d contract_drafting"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:16379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    profiles: ["application"]
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: { condition: service_healthy }
  api:
    profiles: ["application"]
    <<: *backend
    ports: ["127.0.0.1:18400:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live')"]
      interval: 5s
      timeout: 3s
      retries: 20
  worker:
    profiles: ["application"]
    <<: *backend
    command: ["celery", "-A", "app.worker:celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    depends_on:
      onlyoffice: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
  scheduler:
    profiles: ["application"]
    <<: *backend
    command: ["celery", "-A", "app.worker:celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
  frontend:
    profiles: ["application"]
    build:
      context: ../frontend
    environment:
      API_PROXY_TARGET: http://api:8000
    ports: ["127.0.0.1:15173:5173"]
    volumes:
      - ../frontend/src:/app/src
      - ../frontend/public:/app/public:ro
      - ../frontend/index.html:/app/index.html:ro
    depends_on:
      api: { condition: service_healthy }
  gateway:
    image: nginx:1.28.0-alpine
    profiles: ["gateway"]
    ports: ["127.0.0.1:18088:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      api: { condition: service_healthy }

volumes:
  postgres_data:
  redis_data:
  preview_data:
  onlyoffice_data:
  onlyoffice_cache:
  onlyoffice_logs:
  onlyoffice_db:
